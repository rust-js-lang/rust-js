name: Build rust-js
description: rust-js at target/<profile>/rust-js, the release build or the debug one the tests run, from the cache when the compiler's sources haven't changed.
inputs:
  profile:
    description: "`release`, or `debug`, Cargo's dev profile, which the suite runs"
    default: release
runs:
  using: composite
  steps:
    # The binary itself, for the compiler's sources as they are, which are
    # all it's made of, build.rs's inputs: a run that changes only tests or
    # scripts builds nothing. About half of main's pushes change none
    # (80 of 2026-11-15, 38): each test shard's build of the debug one was
    # 136 s of its longest leg (check 43700659375).
    - id: binary
      uses: actions/cache@v6
      with:
        path: target/${{ inputs.profile }}/rust-js
        key: rust-js-${{ inputs.profile }}-${{ runner.os }}-${{ hashFiles('src/**', 'crates/**', 'std/manifest.json', 'rust-toolchain.toml', 'build.rs', 'Cargo.toml', 'Cargo.lock') }}
    - if: steps.binary.outputs.cache-hit != 'true'
      name: Install the pinned Rust toolchain
      shell: bash
      run: rustup show
    # Else what a build of these dependencies left: they aren't downloaded
    # or compiled again, only rust-js is. One entry for each set of them,
    # keyed by what they're built from, not by the commit: a 450 MB entry
    # a push, of six such caches, held the repository's 10 GB of caches
    # full and each evicted the others (docs/dev-loop.md).
    - if: steps.binary.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/${{ inputs.profile }}
        key: rustc-tests-${{ inputs.profile }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: rustc-tests-${{ inputs.profile }}-${{ runner.os }}-
    - if: steps.binary.outputs.cache-hit != 'true'
      name: Build rust-js
      shell: bash
      run: cargo build --locked ${{ inputs.profile == 'release' && '--release' || '' }}
