name: Nightly

# Every test there is, of `main`, each night at 02:00 UTC+7: check.yml's
# jobs, the suite with the files only it runs (ADR 1030), the examples, the WASM compiler, rustc's tests, with
# every mutation where a branch's check runs only its own, a batch of
# generated programs, new ones each night (ADR 0092), each case of the
# corpus and each of those programs after each of tidy's stages (ADR 0659)
# and without each of preparation's rewrites (ADR 1087), each case with
# std's iterator structs alone (ADR 0908), every case of the iterator
# conformance matrix (ADR 1090), the crates of crates.io's corpus against
# docs/crate-corpus.md, and React's port against the JS it committed. Of a
# public repository, GitHub's machines cost nothing. A red night opens an
# issue, `Nightly red: <date>`, which the issue watch gives an owner;
# `bun run ci:status` shows the latest run.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # check.yml's plan reads its runs.
  actions: read

# Each compile counts its decisions' answers (ADR 1124): each job sums
# them and keeps them, `decision-counts`, and `decision-coverage` merges
# the night's, which answers no program reached.
env:
  RUST_JS_DECISIONS: /tmp/decisions.tsv

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    # Its mutations file the night's survivors (ADR 0093, amended).
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      test_shards: '2'
      nightly: true
      part: suite
      max_parallel: '2'

  # Every mutation, after the suite's jobs: its 16 shards 9 at once, the
  # Nightly's widest lane (scripts/runners.ts).
  check-mutations:
    needs: check
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      test_shards: '2'
      nightly: true
      part: mutations
      max_parallel: '9'

  # Each night's programs are new: 600 from the day's number times 600.
  seeds:
    runs-on: ubuntu-latest
    outputs:
      start: ${{ steps.start.outputs.start }}
    steps:
      - id: start
        run: echo "start=$(( $(date +%s) / 86400 * 600 ))" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: seeds
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/rustc-tests.yml
    # What its survivors job may use, though this runs no mutations: a
    # called workflow's every job is held to what its caller grants.
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      fuzz_seeds: '600'
      fuzz_start: ${{ needs.seeds.outputs.start }}
      decisions: true
      max_parallel: '1'

  # Tidy's stages and preparation's rewrites on the whole corpus (ADRs
  # 0659, 1087): each case's JS as tidy leaves it after each stage, and as
  # preparation leaves it without each rewrite that changed it, runs as
  # native Rust does, a sixth of the cases on each of six machines; the
  # nightly's suite runs a few of them.
  stages:
    name: tidy stages (${{ matrix.part }}/6)
    needs: metamorphic
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Each stage's JS runs under Node, whose TypeScript runner needs 22.18 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      # Each case's native side is built with the pinned toolchain.
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run part ${{ matrix.part }} of 6
        env:
          TIDY_STAGES: corpus
          RUST_JS_CASES: ${{ matrix.part }}/6
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun test --timeout=300000 test/tidy-stages.test.ts
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The night's generated programs through the same (ADR 1087): each of
  # the day's 600, whose JS runs as native Rust's, after each of tidy's
  # stages and without each of preparation's rewrites that changed it, a
  # hundred on each of six machines; one that differs is reduced, in
  # `target/fuzz/seed-<n>.stages.rs`.
  programs:
    name: program stages (${{ matrix.part }}/6)
    needs: [stages, seeds]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run part ${{ matrix.part }} of 6
        env:
          TIDY_STAGES: programs
          START: ${{ needs.seeds.outputs.start }}
          PART: ${{ matrix.part }}
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: FUZZ_START=$(( START + (PART - 1) * 100 )) FUZZ_SEEDS=100 bun test --timeout=900000 test/tidy-stages.test.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: program-stages-${{ matrix.part }}
          path: target/fuzz/
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # One meaning per iterator (ADR 0908): each case built with std's
  # iterator structs alone, none rewritten in place, runs as native Rust
  # does, but the cases `differs` lists; the nightly's suite runs a few of them.
  forms:
    name: iterator forms (${{ matrix.part }}/2)
    needs: fuzz
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run part ${{ matrix.part }} of 2
        env:
          ITERATOR_FORMS: corpus
          RUST_JS_CASES: ${{ matrix.part }}/2
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun test --timeout=300000 test/iterator-forms.test.ts
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The same input gives the same output (ADR 1003, #866): each case
  # compiled twice, as a program and as a library, gives the same JS, map
  # and manifest; the nightly's suite compiles a few of them eight times.
  determinism:
    name: determinism (${{ matrix.part }}/2)
    needs: forms
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run part ${{ matrix.part }} of 2
        env:
          DETERMINISM: corpus
          RUST_JS_CASES: ${{ matrix.part }}/2
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun test --timeout=600000 test/determinism.test.ts
      # And a case's builds compiled in one rustc session by the worker are
      # their own compiles' (ADR 1182, #2301): every case that runs, each
      # build alone, then one job program-first and one library-first, byte
      # for byte; four parts of the part's cases at once, one a core.
      - name: The worker's jobs, part ${{ matrix.part }} of 2
        env:
          RUST_JS_WORKER_CASES: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
          PART: ${{ matrix.part }}
        run: bun scripts/parts.ts $(( (PART - 1) * 4 + 1 ))-$(( PART * 4 ))/8 test/worker.test.ts --timeout=900000
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The React Compiler sweep (ADR 1142): the lowering tests' programs that
  # use React, each run with its fixtures kept, and React Compiler, at the
  # version Vite's React plugin uses, over each module they wrote; per push
  # test/react-compiler.test.ts runs it over the guide, examples/ and its
  # cases.
  react-compiler:
    name: react-compiler (${{ matrix.part }}/2)
    needs: object-model
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The browser too: the sweep runs each test file whole, so each writes
      # all its programs, and the Vite and Next ones drive one (#1747).
      - name: Install packages and the browser
        run: |
          bun install --frozen-lockfile
          bunx --bun playwright install chromium
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run part ${{ matrix.part }} of 2
        env:
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/react-compiler-sweep.ts ${{ matrix.part }}/2

  # The metamorphic net (#939, ADR 1104): every corpus case rewritten each
  # way scripts/metamorph keeps its meaning, in both builds against native
  # Rust, but the rewrites test/known/metamorphic/ lists; each push runs
  # one case in 128. Its 39 rewrites' 4 parts on one machine took 141-149
  # minutes and were stopped at its 150 (nightly 42927113223, #1306), so
  # it's 12 parts on 3 machines, 4 a machine, one a core.
  metamorphic:
    name: metamorphic net (${{ matrix.machine }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        machine: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      # Miri, which the reducer asks of each step of a case with `unsafe`
      # code, so its failure comes reduced (#1104).
      - name: Install Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup
      - name: Run parts of machine ${{ matrix.machine }} of 3
        env:
          METAMORPHIC: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
          MACHINE: ${{ matrix.machine }}
        run: bun scripts/parts.ts $(( (MACHINE - 1) * 4 + 1 ))-$(( MACHINE * 4 ))/12 test/metamorphic.test.ts --timeout=1800000
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The object model's net (#891, ADR 1105): every corpus case's items moved
  # into a library, the program run with each value the library gives it
  # read through a counting proxy, its reads as built against its least
  # JS's and its output against native Rust, but the cases
  # test/object-model-known.txt lists; each push that changes the object
  # model's owners or the readability passes runs one case in 64.
  object-model:
    name: object model net
    needs: determinism
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run its 4 parts
        env:
          OBJECT_MODEL: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/object-model.test.ts --timeout=900000
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The `None` matrix (#855, ADR 1096): an `Option` of each payload held in
  # each kind of place, each with its `NoneForm`, written each way and read
  # each way, in both builds, runs as native Rust does but the programs
  # test/none-matrix.test.ts lists; each push runs a sample where a `None`'s
  # form changes.
  nones:
    name: None matrix
    needs: points
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run every program
        env:
          NONE_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun test --timeout=600000 test/none-matrix.test.ts
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The neighbour shuffle (#853, ADR 1103): the day's seed's groups of the
  # corpus's cases, each group one crate, in both builds against native
  # Rust, but the pairs test/known/neighbours/ lists; each push runs seed
  # 0's first two groups and each listed pair.
  neighbours:
    name: neighbour shuffle
    needs: [matrix, seeds]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      # Miri, which the reducer asks of each step of a case with `unsafe`
      # code, so its failure comes reduced (#1104).
      - name: Install Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup
      - name: Run its 4 parts
        env:
          NEIGHBOURS: all
          NEIGHBOURS_SEED: ${{ needs.seeds.outputs.start }}
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/neighbours.test.ts --timeout=1800000
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The memory net (#1172): 400 seeds from the day's, each a program of
  # unsafe Rust over plain data, run under Miri, which must find it
  # defined, natively on wasm32 and as JS in both builds; what rust-js
  # refuses is ranked by its reason in the artifact. Each push that changes
  # the pointers' code runs the slice's 24 (check.yml's `memory-net`).
  memory:
    name: memory net
    needs: [nones, seeds]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Install Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup
      - name: Run its 4 parts
        env:
          MEMORY_NET: all
          MEMORY_NET_START: ${{ needs.seeds.outputs.start }}
          RUST_JS_REQUIRE_MIRI: '1'
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/memory-net.test.ts --timeout=1800000
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-net
          path: target/memory-net
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The Rustlantis net (ADR 1125): 1,000 programs of custom MIR from the
  # day's seed, UB-free by construction, made by Rustlantis at its pinned
  # commit with rust-js's wasm32 patch, natively on wasm32 and as JS in both
  # builds; what rust-js does to each is to run it as native Rust does,
  # refuse it, or an open issue's, test/rustlantis-known.txt.
  rustlantis:
    name: Rustlantis net
    needs: [port, seeds]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run its 4 parts
        env:
          RUSTLANTIS_SEEDS: '1000'
          RUSTLANTIS_START: ${{ needs.seeds.outputs.start }}
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/rustlantis.test.ts --timeout=900000
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The `&mut` matrix (ADR 1086): each pointee of a `&mut`, held each way,
  # through each operation, in both builds, runs as native Rust does; each
  # push runs a sample.
  mut-refs:
    name: mut-ref matrix
    needs: memory
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run every program
        env:
          MUT_REF_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun test --timeout=300000 test/mut-ref-matrix.test.ts
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The iterator conformance matrix (ADR 1090): every case, each source,
  # chain, consumer and panic site, in both builds against native Rust, but
  # those test/known/iterator-matrix/ lists; a check whose change is the
  # iterators' code runs its slice (check.yml's `iterators`, #731).
  matrix:
    name: iterator matrix (${{ matrix.machine }}/6)
    needs: crater
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        machine: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      # Four parts of the 24 on each machine, one a core.
      - name: Run parts of machine ${{ matrix.machine }} of 6
        env:
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
          MACHINE: ${{ matrix.machine }}
        run: bun scripts/parts.ts $(( (MACHINE - 1) * 4 + 1 ))-$(( MACHINE * 4 ))/24 test/iterator-matrix.test.ts --timeout=900000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iterator-matrix-${{ matrix.machine }}
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The iterator conformance table (ADR 1092): each adapter alone through
  # each step of the contract, in both builds against native Rust, but the
  # rows of test/known/iterator-matrix/ it lists.
  conformance:
    name: iterator conformance (${{ matrix.machine }}/2)
    needs: numbers
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        machine: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run parts of machine ${{ matrix.machine }} of 2
        env:
          ITERATOR_TABLE: conformance
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
          MACHINE: ${{ matrix.machine }}
        run: bun scripts/parts.ts $(( (MACHINE - 1) * 4 + 1 ))-$(( MACHINE * 4 ))/8 test/iterator-matrix.test.ts --timeout=900000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iterator-conformance-${{ matrix.machine }}
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The points table (#817): each of the conformance table's cases run once
  # a panic point, each closure call, drop, clone and step of the crate's
  # iterator, in both builds against native Rust, but the `points:` rows of
  # test/known/iterator-matrix/.
  points:
    name: iterator panic points
    needs: conformance
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run its 4 parts
        env:
          ITERATOR_TABLE: points
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/iterator-matrix.test.ts --timeout=900000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iterator-points
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The unwind table (#854): each operation beyond iterators, a value's
  # fields, closures, collections' operations that call the crate's code,
  # `Option` and `Result` combinators, comparators and `?`, of each shape of
  # value, run once a panic point, in both builds against native Rust, but
  # the `unwind:` rows of test/known/iterator-matrix/.
  unwind:
    name: panic points beyond iterators
    needs: format
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run its 4 parts
        env:
          ITERATOR_TABLE: unwind
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/iterator-matrix.test.ts --timeout=900000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unwind-points
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The formatting grid (#941): every format spec of each value its trait
  # applies to, by each sink in turn, in both builds against native Rust,
  # but the `format:` rows of test/known/iterator-matrix/.
  format:
    name: formatting grid
    needs: rustlantis
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run its 4 parts
        env:
          ITERATOR_TABLE: format
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/iterator-matrix.test.ts --timeout=900000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: format-grid
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The numbers grid (#940): every integer and float operation of each
  # type's boundary values, each cast between every pair, each parse, in
  # both builds against native Rust, but the `numbers:` rows of
  # test/known/iterator-matrix/.
  numbers:
    name: numbers grid
    needs: react-compiler
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run its 4 parts
        env:
          ITERATOR_TABLE: numbers
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/iterator-matrix.test.ts --timeout=900000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: number-grid
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The async table (#942): each family of async bodies, values live across
  # `.await`, of each shape, at each panic point, in both builds against
  # native Rust, but the `async:` rows of test/known/iterator-matrix/.
  async:
    name: panic points across await
    needs: unwind
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run it
        env:
          ITERATOR_TABLE: async
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun test --timeout=900000 test/iterator-matrix.test.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: async-table
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The copy matrix (test/copy-matrix.ts, ADR 1090, amended): each
  # compiled iterator form copied each way and stepped by each ability
  # beside its original, all 23,000 or so cases, in both builds against
  # native Rust, but the `copies:` rows of test/known/iterator-matrix/.
  copies:
    name: copy matrix
    needs: crates
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run it in 4 parts
        env:
          ITERATOR_TABLE: copies
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/iterator-matrix.test.ts --timeout=1800000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: copy-matrix
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The consumer net (test/consumer-net.ts): each std method that takes an
  # iterator by value, of each source, as it is and with a closure's or a
  # step's panic, and of the crate's iterator and a map of it, an item's
  # drop's and the source's own drop's, by each caller, a library's generic
  # code's too (#2572), in both builds against native Rust, but the
  # `consumers:` rows of test/known/iterator-matrix/.
  consumers:
    name: consumer net
    needs: mut-refs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run it in 4 parts
        env:
          ITERATOR_TABLE: consumers
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/iterator-matrix.test.ts --timeout=900000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-net
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The std net (test/std-net.ts, #1171): each std method that changes a
  # collection in place or calls what it's given, as it is and with what it
  # calls panicking, in both builds against native Rust, but the `std:` rows
  # of test/known/iterator-matrix/.
  std:
    name: std net
    needs: async
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Native programs' runs, kept by what they were built from: those
      # unchanged since the last night's aren't built or run again, and 2%
      # of them are, failing where one differs (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: ${{ github.job }}-${{ strategy.job-index }}
          nightly: 'true'
      - name: Run it in 4 parts
        env:
          ITERATOR_TABLE: std
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/parts.ts 4 test/iterator-matrix.test.ts --timeout=900000
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: std-net
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: ${{ github.job }}-${{ strategy.job-index }}
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # All of the twin net (test/twin-net.ts, #1205): each table's cases in the
  # plain build, the runtime's hand-written helpers, against the build of
  # std's own bodies, no native run; and each helper both builds import is
  # one test/twin-net.ts's lists name, each `pitted` names pitted still.
  # Its lists' drift alone, a helper pitted now that `pitted` doesn't name
  # or one `shared` names that's pitted or imported by none, fails nothing:
  # it's blessed, `bless-twin-net`, for `bun run ci:bless nightly` (ADR
  # 1122, amended). A push runs each table's slice.
  twins:
    name: twin net
    needs: neighbours
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run it in 4 parts
        env:
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/iteratorSlice.ts run twinsAll 4
      - name: Bless its lists' drift
        id: drift
        run: |
          BLESS=1 bun test/twin-net.ts helpers
          git diff --binary -- test/twin-net.ts > bless.patch
          if [ -s bless.patch ]; then
            echo "drift=1" >> "$GITHUB_OUTPUT"
            echo "The twin net's lists drifted, no coverage lost: \`bun run ci:bless nightly\` applies \`bless-twin-net\`." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.drift.outputs.drift == '1'
        uses: actions/upload-artifact@v7
        with:
          name: bless-twin-net
          path: bless.patch
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: twin-net
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The crates from crates.io the guide says run (docs/crate-corpus.md):
  # each compiled with every crate it uses, its probe run beside native
  # Rust, a crate doing worse than its row says failing the job, as chrono
  # and rust_decimal went from runs to refused unseen (#467, #468).
  crates:
    name: crate corpus
    needs: twins
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Each crate's graph at its lock (ADR 1067, amended). Cargo's jobs at
      # their default again: what shut the runner down, regex-syntax's
      # `==` inlined without end, is fixed, and rust-js's largest process
      # of the corpus is 427 MB (#511).
      - name: Compile and run each crate's probe
        env:
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/crate-corpus.ts --check
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # The small Crater, crater.yml, its one definition (ADR 1109): every
  # crate of the corpus, four shards one at a time, then its report.
  crater:
    uses: ./.github/workflows/crater.yml
    with:
      shards: '[1, 2, 3, 4]'
      max_parallel: '1'

  # React's port (scripts/react-in-rust.ts): react-in-rust at the commit
  # `ports/react-in-rust.pin` names, each of its crates compiled to JS by
  # this compiler, against the JS that commit committed. A compile error or
  # a file that differs fails it, the summary listing each file and its
  # first lines of change, the whole diff an artifact: a change to the
  # port's JS is seen the night it's made, not at its porter's next
  # regeneration (rd540, rd617, rd623). One that's intended is accepted by
  # moving the pin to the port's commit that regenerated it.
  port:
    name: react-in-rust port
    needs: consumers
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # All of `main`'s history, so the report lists the commits since the
      # rust-js the pin's JS was made on.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # rust-js's build CLI, as the port's `yarn rust` runs it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Compile the port's crates and compare their JS
        env:
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/react-in-rust.ts regen
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: react-in-rust-diff
          path: target/react-in-rust.diff
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: ./.github/actions/decision-counts
        with:
          name: ${{ github.job }}.${{ strategy.job-index }}

  # Which answers of the compiler's decisions no program of the night
  # reached (ADR 1124): each job's summed counts merged, the report in the
  # run's summary and an artifact. A never-reached answer is a template or
  # a corpus case to write; a red night is the nets', not this.
  decision-coverage:
    name: decision coverage
    needs: [check, check-mutations, fuzz, stages, programs, forms, determinism, metamorphic, object-model, nones, neighbours, memory, rustlantis, mut-refs, matrix, conformance, points, unwind, format, numbers, async, consumers, copies, std, twins, crates, crater, port]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          pattern: decisions-*
          path: decisions
      # An artifact a job, `decisions-matrix.3`, its file the net's.
      - run: |
          mkdir -p counts
          for dir in decisions/decisions-*; do mv "$dir/decisions.tsv" "counts/${dir#decisions/decisions-}.tsv"; done
          bun scripts/decision-coverage.ts --merge counts
          cat target/decision-coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: decision-coverage
          path: target/decision-coverage/report.md
          retention-days: 30

  # How long each of the night's jobs, steps, test files and tests took
  # (scripts/testTimes.ts): the suite's by bun's JUnit reports, `junit-*`,
  # the jobs' and steps' as GitHub kept them; the top 25 files and tests
  # and each job's total in the run's summary, and what's slower than the
  # last night's, by more than 30 s or a quarter, so a slow spot is found
  # by measurement and one growing is seen the next morning. Kept as
  # `test-times`, which the next night compares with.
  test-times:
    name: test times
    needs: [check, check-mutations, fuzz, stages, programs, forms, determinism, react-compiler, metamorphic, object-model, nones, neighbours, memory, rustlantis, mut-refs, matrix, conformance, points, unwind, format, numbers, async, consumers, copies, std, twins, crates, crater, port]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: junit
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/testTimes.ts merge junit target/test-times
          cat target/test-times/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: test-times
          path: target/test-times/test-times.json
          retention-days: 30

  # The test selector's audit (scripts/selector-audit.ts, ADR 1101,
  # amended): each test file the night's suite failed that no push's check
  # since the last green night selected is a miss, filed as a P1
  # `selector: …`: the change that broke it went by unchecked.
  selector-audit:
    name: selector audit
    needs: [std, check]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: junit
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/selector-audit.ts junit

  # The kind × area count (scripts/clusters.ts, ADR 1085): the open
  # clusters, one comment on the architecture review's campaign, #1681,
  # edited in place each night.
  clusters:
    needs: copies
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/clusters.ts --comment=1681 >> "$GITHUB_STEP_SUMMARY"

  # What CI spent the last 24 hours (scripts/ci-spend.ts, docs/dev-loop.md's
  # "CI spend"): runner-minutes by workflow and job kind, their share of
  # the free plan's 20 jobs at once, queue waits, push-to-verdict latency
  # and the minutes wasted, one comment on the pinned "CI spend" issue,
  # #1989, edited in place each night with the days before; waste over 10%
  # of the day, a job kind grown past 30% or a micro-benchmark past 1.5
  # times the night before's flagged.
  ci-spend:
    needs: clusters
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The runtime's micro-benchmarks, kept with the days and flagged where
      # one took past half again the night before's (test/lend-bench.ts, #2003).
      - run: bun test/lend-bench.ts target/bench.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-spend.ts --comment=1989 --bench=target/bench.json >> "$GITHUB_STEP_SUMMARY"

  # A red night of `main` is an issue, "Nightly red: <date>", opened or, run
  # again that day, commented on, naming each failed job with its link: the
  # issue watch gives it an owner that day, and no one polls for it.
  issue:
    needs: [check, check-mutations, seeds, fuzz, stages, programs, forms, determinism, memory, rustlantis, mut-refs, matrix, conformance, points, unwind, format, numbers, async, consumers, copies, std, crates, crater, port]
    if: always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the night's issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          day=$(TZ=Asia/Bangkok date +%F)
          title="Nightly red: $day"
          failed=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"')
          body=$(printf 'The nightly of `main` at %s failed: %s\n\n%s\n\nRead each failed job'"'"'s log (`gh run view %s --log-failed`); a regression is fixed, or filed as an issue of its own, and this is closed.\n' \
            "${GITHUB_SHA:0:9}" "$RUN" "$failed" "${{ github.run_id }}")
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
