name: Check

# Every check but the inner loop's, of each push to `main`, so a change is
# made here and proved there while the next one is made (DEVELOPMENT.md):
# the repository is public, and its machines cost nothing. Of another
# branch, started by hand, `bun run ci:check`; `main`'s push starts its own. Its jobs run at once; a red
# one is fixed at once, on `main`. A job whose snapshots or rustc's lists differ uploads what
# blessing them writes, a `bless-*` artifact, which `bun run ci:bless`
# applies to be read.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_shards:
        description: 'Machines the suite is split across: more is sooner, and more minutes, as each sets itself up.'
        type: choice
        options: ['1', '2', '4']
        default: '2'
      since:
        description: 'The commit whose changes since are the mutations run: of main, its last checked one.'
        type: string
        default: 'origin/main'
      mutation_shards:
        description: 'Machines the mutations are split across, the fewest whose every shard is expected to end in 10 min: ci:check sizes them by the mutations'' times.'
        type: choice
        options: ['1', '2', '4', '8', '16']
        default: '1'
  # By nightly.yml, of `main`: every mutation, where a branch's check runs
  # only its own, and the test files only the nightly runs (ADR 1030).
  workflow_call:
    inputs:
      test_shards:
        type: string
        default: '2'
      nightly:
        type: boolean
        default: false
      # Which of its jobs a run of the Nightly's runs: `suite`, all but the
      # mutations, or `mutations`, those alone, after the suite's; '' all.
      # The Nightly's two calls hold its runners one after the other
      # (scripts/runners.ts, `NIGHTLY_RUNNERS`).
      part:
        type: string
        default: ''
      # How many of each matrix's jobs at once, its called workflows' too;
      # '' each its own.
      max_parallel:
        type: string
        default: ''

permissions:
  contents: read

# One run at a time of each branch and how it was started, a push's or one
# by hand, and no branch's touches another's. A run waits for the one
# running, then runs, and never cancels it: of several waiting, only the
# newest runs, and the next finished run's mutations are of all their
# changes (the `plan` job). One started by hand waits apart from the
# pushes', as GitHub drops a waiting run of the group for a newer one: a
# check started by hand to measure, in the pushes' group, dropped the
# checks of two pushes waiting behind it (44846113211). (When a run started by hand cancelled the one running, with
# three agents pushing to `main`, each starting one after it pushed, no
# check of `main` finished for hours.) rustc-tests.yml's runs are a group
# of their own, and so is nightly.yml's call, so neither waits for nor
# cancels this.
concurrency:
  group: ${{ github.workflow == 'Check' && format('ci-{0}-{1}', github.ref, github.event_name) || format('ci-{0}', github.workflow) }}
  cancel-in-progress: false

jobs:
  # Which mutations, those of what changed since `main`'s last check whose
  # mutations passed, a cancelled or failed one's changes too, or since a
  # check started by hand's `since`, and on how many machines; and whether
  # what changed is the iterators' code (scripts/iteratorSlice.ts).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      since: ${{ steps.plan.outputs.since }}
      retry: ${{ steps.plan.outputs.retry }}
      shards: ${{ steps.plan.outputs.shards }}
      iterators: ${{ steps.plan.outputs.iterators }}
      formatting: ${{ steps.plan.outputs.formatting }}
      numbers: ${{ steps.plan.outputs.numbers }}
      memory: ${{ steps.plan.outputs.memory }}
      intervals: ${{ steps.plan.outputs.intervals }}
      declarations: ${{ steps.plan.outputs.declarations }}
      async: ${{ steps.plan.outputs.async }}
      consumers: ${{ steps.plan.outputs.consumers }}
      std: ${{ steps.plan.outputs.std }}
      twins: ${{ steps.plan.outputs.twins }}
      cases: ${{ steps.plan.outputs.cases }}
      crates: ${{ steps.plan.outputs.crates }}
      port: ${{ steps.plan.outputs.port }}
      mutations: ${{ steps.plan.outputs.mutations }}
      mutation_timings: ${{ steps.plan.outputs.mutation_timings }}
      test_timings: ${{ steps.plan.outputs.test_timings }}
      wasm: ${{ steps.plan.outputs.wasm }}
      rustc: ${{ steps.plan.outputs.rustc }}
      tests: ${{ steps.plan.outputs.tests }}
      batch_base: ${{ steps.plan.outputs.batch_base }}
      test_shards: ${{ steps.plan.outputs.test_shards }}
      test_shard_list: ${{ steps.plan.outputs.test_shard_list }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The test map the selector reads (scripts/select.ts, ADR 1101,
      # amended): the newest test-map.yml kept, of the toolchain its key's
      # is of, a map's toolchain.
      - run: rustup show
      - uses: actions/cache/restore@v6
        with:
          path: .cache/test-maps
          key: test-map-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: test-map-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci.ts plan ${{ inputs.since && format('--since={0}', inputs.since) || '' }} ${{ inputs.test_shards && format('--test-shards={0}', inputs.test_shards) || '' }} >> "$GITHUB_OUTPUT"
      # What the suite's shards run of it.
      - if: ${{ inputs.part != 'mutations' }}
        uses: actions/upload-artifact@v7
        with:
          name: selection
          path: target/selection.json
          retention-days: 7

  # rust-js's release build, once a run, for the jobs that use it
  # (./.github/actions/build-rust-js): each restores the binary it caches,
  # where each started together and built it again, 9 builds of about 3 min
  # a run whose compiler changed (docs/dev-loop.md). Beside `plan`.
  build:
    if: ${{ inputs.part != 'mutations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: ./.github/actions/build-rust-js

  # Of a change to the iterators' code (scripts/iteratorSlice.ts's
  # `iteratorPaths`, its one list), as `plan` says: every corpus case built
  # with std's iterator structs alone (ADR 0908, `ITERATOR_FORMS=corpus`),
  # against native Rust, on a machine of its own beside `nets-iterators`'
  # slices, as it runs some 8 min: a regression only that build shows,
  # #766's, reached `main` where only the nightly's `forms` ran it.
  iterator-forms:
    name: iterator forms of the corpus
    needs: [plan, build]
    if: ${{ inputs.part != 'mutations' && !inputs.nightly && needs.plan.outputs.iterators == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run the corpus with std's iterator structs
        env:
          RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
        run: bun scripts/iteratorSlice.ts run forms
      # Its parts' JUnit reports, each beside what ran it: a failed check's
      # `attribute` runs each failing case again at the batch's commits (#2003).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-forms
          path: target/junit
          if-no-files-found: ignore
          retention-days: 14

  # The iterator nets of a change to the iterators' code, the matrix's,
  # the conformance table's and the copy matrix's slices, on a machine of
  # their own, and the program nets on another (`nets-programs`): one job
  # of every net ran them beside the rest, its longest steps, and was the
  # check's longest leg (docs/dev-loop.md). Each job's summary says which
  # of its nets failed, as `nets`' does.
  nets-iterators:
    needs: [plan, build]
    if: >-
      ${{ !inputs.nightly && needs.plan.outputs.iterators == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
    steps:
      # A slice reads the rows its change names, by the change's history
      # since it left `main`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # The iterator matrix's slice (ADR 1090, #731), of a change to the
      # iterators' code (scripts/iteratorSlice.ts's `iteratorPaths`): its
      # fixed batches, of every source, adapter, consumer and panic site, in
      # both builds against native Rust. The nightly's `matrix` runs every batch.
      - name: iterator matrix slice
        id: iterators
        if: needs.plan.outputs.iterators == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run matrix 2
      # Of the same change, the conformance table's slice (ADR 1092).
      - name: iterator conformance slice
        id: conformance
        if: needs.plan.outputs.iterators == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run conformance 1
      # And the paths table, all of it (test/iterator-paths.ts, #2112): each
      # adapter through each step std's adapter writes, by each path generic
      # and boxed code reaches it, `&mut I`, `Box<dyn I>`, a clone and the
      # rest. Its 48 batches take some 20 s in 4 parts on the Mac mini.
      - name: iterator paths table
        id: paths
        if: needs.plan.outputs.iterators == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run paths 2
      # And the copy matrix's slice (test/copy-matrix.ts, ADR 1090,
      # amended): each compiled form copied each way and stepped by each
      # ability beside its original. The nightly's `copies` runs all of it.
      - name: copy matrix slice
        id: copies
        if: needs.plan.outputs.iterators == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run copies 2
      - wait-all:
      # Which nets failed, by name, in the job's summary.
      - name: Say which nets failed
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: bun scripts/ci.ts nets >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nets-iterators
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14
      # The slices' JUnit reports, as `iterator-forms`' (#2003).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-nets-iterators
          path: target/junit
          if-no-files-found: ignore
          retention-days: 14


  # The program nets, the consumer net's and the twin net's slices, of a
  # change to the iterators' or the drops' code, on a machine of their own
  # (as `nets-iterators`).
  nets-programs:
    needs: [plan, build]
    if: >-
      ${{ !inputs.nightly && (needs.plan.outputs.consumers == 'true' || needs.plan.outputs.twins == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
    steps:
      # A slice reads the rows its change names, by the change's history
      # since it left `main`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # The consumer net (test/consumer-net.ts), of a change to the
      # iterators' code or the drops' (`consumerPaths`).
      - name: consumer net
        id: consumers
        if: needs.plan.outputs.consumers == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run consumers 2
      # The twin net (test/twin-net.ts, #1205), of a change to the
      # iterators' code (`twinPaths`): each table's slice in the plain build
      # against the build of std's own bodies. All of it is the nightly's `twins`.
      - name: twin net
        id: twins
        if: needs.plan.outputs.twins == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run twins 2
      - wait-all:
      # Which nets failed, by name, in the job's summary.
      - name: Say which nets failed
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: bun scripts/ci.ts nets >> "$GITHUB_STEP_SUMMARY"
      # The slices' JUnit reports, as `iterator-forms`' (#2003).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-nets-programs
          path: target/junit
          if-no-files-found: ignore
          retention-days: 14


  # The nets of a check's change whose own run is a few minutes or less,
  # each a step of one machine, run at once (background steps, ten at a
  # time, the rest waiting for one to end): each a job of its own spent
  # most of its minutes setting up, the checkout, packages and toolchain
  # and the compiler, and the check's jobs waited for machines past the
  # plan's 20 at once (docs/dev-loop.md). Each runs where `plan` says its
  # change does, as before; one that fails is a step of its name, red, and
  # the job's summary names it. The nightly runs each of its own.
  nets:
    needs: [plan, build]
    if: >-
      ${{ !inputs.nightly && (needs.plan.outputs.formatting == 'true' ||
      needs.plan.outputs.numbers == 'true' || needs.plan.outputs.memory == 'true' || needs.plan.outputs.intervals == 'true' || needs.plan.outputs.declarations == 'true' ||
      needs.plan.outputs.async == 'true' || needs.plan.outputs.std == 'true' || needs.plan.outputs.cases == 'true' || needs.plan.outputs.crates == 'true' ||
      needs.plan.outputs.port == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_JS_COMPILER: ${{ github.workspace }}/target/release/rust-js
    steps:
      # The metamorphic rewrites read what changed since `plan`'s `since`,
      # and React's port its pin's history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # The formatting grid's slice (test/format-grid.ts, #941), of a change
      # to the formatting code (`formatPaths`).
      - name: formatting grid slice
        id: format
        if: needs.plan.outputs.formatting == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run format 1
      # The numbers grid's slice (test/number-grid.ts, #940), of a change to
      # the numbers' code (`numberPaths`).
      - name: numbers grid slice
        id: numbers
        if: needs.plan.outputs.numbers == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run numbers 1
      # The memory net's slice (test/memory-net.ts, #1172), of a change to
      # the pointers' code (`memoryPaths`): its 24 seeds, in both builds
      # against native wasm32. The nightly's `memory` runs 400 under Miri.
      - name: memory net slice
        id: memory
        if: needs.plan.outputs.memory == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run memory 1
      # The intervals' variant of the readability passes' net
      # (test/tidy-stages.test.ts, #2112 B), of a change to the facts MIR's
      # intervals keep or what writes past them (`intervalsPaths`): its few
      # cases without the intervals' proofs, against native Rust. The
      # nightly's `stages` runs every case's.
      - name: intervals' variant
        id: intervals
        if: needs.plan.outputs.intervals == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run intervals 1
      # Every TypeScript caller of the declarations (#822), of a change to
      # what a `None` is at the JS boundary (`declarationPaths`).
      - name: declarations' TypeScript callers
        id: declarations
        if: needs.plan.outputs.declarations == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run declarations 1
      # The async table (test/async-points.ts, #942), of a change to how a
      # future awaits and drops (`asyncPaths`).
      - name: async table
        id: async
        if: needs.plan.outputs.async == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run async 1
      # The std net (test/std-net.ts, #1171), of a change to std's
      # collections', slices', strings' or cells' code (`stdNetPaths`).
      - name: std net
        id: std
        if: needs.plan.outputs.std == 'true'
        background: true
        run: bun scripts/iteratorSlice.ts run std 1
      # Each metamorphic rewrite of each corpus case the change adds or
      # edits since `plan`'s `since` (`changedCases`, #1164, #1165). Each
      # failure says how to reduce it, which the nightly's run does: a
      # reduction here, 5 min a failure, outran the job.
      - name: metamorphic rewrites of the change's cases
        id: metamorphic
        if: needs.plan.outputs.cases == 'true'
        background: true
        env:
          NET_REDUCE: '0'
        run: bun scripts/iteratorSlice.ts run metamorphic 4 ${{ needs.plan.outputs.since }}
      # The crates of crates.io's corpus against docs/crate-corpus.md (ADR
      # 1067), of a change to what compiles them (`cratePaths`): one in 8 of
      # the top crates by downloads (#1174). The nightly runs every row.
      - name: crate corpus
        id: crates
        if: needs.plan.outputs.crates == 'true'
        background: true
        run: bun scripts/crate-corpus.ts --check --sample
      # React's port at its pin (scripts/react-in-rust.ts), of a change to
      # what compiles it (`portPaths`): a file that differs from what the
      # pin committed fails it (#1188).
      - name: react-in-rust port
        id: port
        if: needs.plan.outputs.port == 'true'
        background: true
        run: bun scripts/react-in-rust.ts regen
      - wait-all:
      # Which nets failed, by name, in the job's summary.
      - name: Say which nets failed
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: bun scripts/ci.ts nets >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nets
          path: |
            target/memory-net
            target/react-in-rust.diff
          if-no-files-found: ignore
          retention-days: 14
      # The slices' JUnit reports, as `iterator-forms`' (#2003).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-nets
          path: target/junit
          if-no-files-found: ignore
          retention-days: 14

  lint:
    if: ${{ inputs.part != 'mutations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: lint-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run fmt:check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The Vite example's build, its committed JS against what rust-js
      # writes, then Vite's, by the compiler the example's plugin finds,
      # this checkout's: a job of its own spent most of its minutes
      # setting up what this one has (docs/dev-loop.md).
      - run: cargo build --locked
      # std/, made again and compared, as \`bun run push\`'s std phase does:
      # a merge on GitHub takes no push gate (#1971). About 3 s, nothing
      # downloaded or uploaded.
      - run: bun scripts/std-fresh.ts
      - run: bun run --cwd examples/vite-react build

  # The suite, on one machine, or split across `test_shards`, by how long
  # each file took in the last run that kept its timings (scripts/test.ts's
  # `balanced` dealing): each shard uploads what it measured, `timings-<shard>`, and
  # the next run's `plan` reads them all and hands them to its shards, so
  # the shards finish together.
  # The nightly's adds the files only it runs (`--nightly`, ADR 1030).
  # Of a push's check, the files and corpus cases its selection says the
  # change can affect (`plan`'s `tests`, scripts/select.ts): none, and the
  # shards are skipped; the nightly's, every one. On as many machines as
  # the selection's expected time needs, `plan`'s `test_shards` (scripts/
  # ci.ts's `testShards`, the mutations' rule, `fewestShards`), each shard
  # about 12 min at most, its matrix `plan`'s `test_shard_list`; a check
  # started by hand's or the nightly's `test_shards` as given.
  test:
    name: test (${{ matrix.shard }}/${{ needs.plan.outputs.test_shards }})
    needs: plan
    if: ${{ inputs.part != 'mutations' && (inputs.nightly || needs.plan.outputs.tests != 'none') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '6') }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.test_shard_list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The corpus runs its cases under Node too, whose TypeScript runner
      # needs Node 22.18 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Each of what the suite needs at once (parallel steps): the
      # toolchain, and the packages with their browser, Chromium alone: the
      # runner's image has every library it asks, and `--with-deps` only
      # added fonts through apt, whose mirror hung 7.7 min (check
      # 44480685461), so no workflow asks it (test/ci.test.ts).
      - parallel:
          - name: Install pinned Rust toolchain
            run: rustup show
          - name: Install packages and the browser
            run: |
              bun install --frozen-lockfile
              bunx --bun playwright install chromium
      # The debug compiler the suite runs, of the compiler's sources: built
      # only where they changed, else the cache's.
      - uses: ./.github/actions/build-rust-js
        with:
          profile: debug
      # The last run's times of each test file, which `plan` read once and
      # gave every shard alike: none downloads them (a shard whose download
      # failed failed, check of 7f324c2ec).
      - name: Write the test files' times plan gave
        env:
          TIMES: ${{ needs.plan.outputs.test_timings }}
        run: bun scripts/ci.ts test-timings "$TIMES"
      # Native programs' runs, kept by what they were built from, and the
      # corpus's verified runs: of a cold corpus part, 236 s, the natives'
      # builds were 191 (docs/dev-loop.md), and none is built again of a
      # program unchanged since main's last run (test/native-outcomes.ts).
      - uses: ./.github/actions/native-outcomes
        with:
          step: restore
          name: test-${{ matrix.shard }}-of-${{ needs.plan.outputs.test_shards }}${{ inputs.nightly && '-nightly' || '' }}
          nightly: ${{ inputs.nightly && 'true' || 'false' }}
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.nightly }}
        with:
          name: selection
          path: target
      - id: test
        env:
          # The nightly's counts each compile's decisions (ADR 1124).
          RUST_JS_DECISIONS: ${{ inputs.nightly && '/tmp/decisions.tsv' || '' }}
          RUST_JS_COMPILER: ${{ github.workspace }}/target/debug/rust-js
        run: bun run test --shard=${{ matrix.shard }}/${{ needs.plan.outputs.test_shards }}${{ inputs.nightly && ' --nightly' || ' --selection=target/selection.json' }}
      - if: always()
        uses: ./.github/actions/native-outcomes
        with:
          step: save
          name: test-${{ matrix.shard }}-of-${{ needs.plan.outputs.test_shards }}${{ inputs.nightly && '-nightly' || '' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.shard }}
          path: target/test-timings.json
          if-no-files-found: ignore
          retention-days: 7
      - if: always() && inputs.nightly
        uses: ./.github/actions/decision-counts
        with:
          name: suite.${{ matrix.shard }}
      # Each run's JUnit report: the nightly's suite's times, which
      # nightly.yml's `test-times` merges, and a failed check's failing
      # tests, which `attribute` runs again at each commit of its batch.
      # A shard whose suite ran and kept none fails here: a missing
      # directory once starved both unseen for days (scripts/test.ts).
      - if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.shard }}
          path: target/junit
          if-no-files-found: error
          retention-days: 14
      # What differs, blessed, as a patch to read and apply: never pushed.
      - name: Bless what differs
        if: failure() && steps.test.outcome == 'failure'
        run: |
          BLESS=1 RUST_JS_COMPILER="$PWD/target/debug/rust-js" bun scripts/test.ts --shard=${{ matrix.shard }}/${{ needs.plan.outputs.test_shards }}${{ inputs.nightly && ' --nightly' || ' --selection=target/selection.json' }} || true
          git add -A
          git diff --cached --binary > bless.patch
      - if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: bless-test-${{ matrix.shard }}
          path: bless.patch
          if-no-files-found: ignore
          retention-days: 7

  # Which commit of the batch broke each test a failed check failed
  # (scripts/attribute.ts): a check of `main` runs once over the commits
  # since the last completed check, so where it fails, each failing test
  # file and corpus case runs again at each commit of that batch, at most
  # 6, each on a machine of its own, after the check's own jobs, and the
  # first it fails at is said, in the run's summary, an `attribution`
  # artifact and `bun run ci:status`: "<test> broke at <sha> (<subject>)".
  attribute-plan:
    needs: [plan, test, iterator-forms, nets-iterators, nets-programs, nets]
    if: >-
      ${{ !cancelled() && !inputs.nightly && (needs.test.result == 'failure' || needs.iterator-forms.result == 'failure' ||
      needs.nets-iterators.result == 'failure' || needs.nets-programs.result == 'failure' || needs.nets.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      commits: ${{ steps.plan.outputs.commits }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: junit
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/attribute.ts plan junit ${{ needs.plan.outputs.batch_base || 'HEAD~1' }} >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: attribute-failing
          path: target/attribute/failing.json
          retention-days: 7

  attribute:
    needs: attribute-plan
    if: ${{ !cancelled() && !inputs.nightly && needs.attribute-plan.outputs.commits != '' && needs.attribute-plan.outputs.commits != '[]' }}
    name: attribute (${{ matrix.commit }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '20') }}
      matrix:
        commit: ${{ fromJSON(needs.attribute-plan.outputs.commits) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
        with:
          profile: debug
      - uses: actions/download-artifact@v8
        with:
          name: attribute-failing
          path: target/attribute
      # Each failing file, each corpus case alone, and each slice run's
      # failing tests by its file and settings, by this commit's own
      # harness; which still fail, `result.json`.
      - name: Run what failed, at this commit
        env:
          RUST_JS_COMPILER: ${{ github.workspace }}/target/debug/rust-js
        run: |
          still=()
          for file in $(jq -r '.files[]' target/attribute/failing.json); do
            [ -f "$file" ] || continue
            bun test "$file" || still+=("$file")
          done
          for name in $(jq -r '.cases[]' target/attribute/failing.json); do
            [ -f "test/corpus/$name" ] || continue
            echo "$name" > target/attribute/case.txt
            RUST_JS_CASES="1/1:$PWD/target/attribute/case.txt" bun test test/corpus.test.ts || still+=("test/corpus/$name")
          done
          while IFS= read -r run; do
            file=$(jq -r .file <<<"$run")
            [ -f "$file" ] || continue
            mapfile -t settings < <(jq -r '.env | to_entries[] | "\(.key)=\(.value)"' <<<"$run")
            env "${settings[@]}" bun test --timeout=600000 "$file" -t "$(jq -r .pattern <<<"$run")" || still+=("$(jq -r .unit <<<"$run")")
          done < <(jq -c '.runs[]?' target/attribute/failing.json)
          printf '%s\n' "${still[@]}" | jq -R . | jq -s "{commit: \"$(git rev-parse HEAD)\", failing: map(select(. != \"\"))}" > target/attribute/result.json
      - uses: actions/upload-artifact@v7
        with:
          name: attribute-result-${{ strategy.job-index }}
          path: target/attribute/result.json
          retention-days: 7

  attribute-report:
    needs: [attribute-plan, attribute]
    if: ${{ !cancelled() && !inputs.nightly && needs.attribute-plan.result == 'success' && needs.attribute-plan.outputs.commits != '' && needs.attribute-plan.outputs.commits != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          name: attribute-failing
          path: target/attribute
      - uses: actions/download-artifact@v8
        with:
          pattern: attribute-result-*
          path: target/attribute/results
      - run: bun scripts/attribute.ts report target/attribute/results
      - uses: actions/upload-artifact@v7
        with:
          name: attribution
          path: target/attribute/attribution.json
          retention-days: 14

  # Which commit of the batch broke a failed check's mutations, by blame,
  # no rerun (scripts/attribute.ts `mutations`): each mutation a shard
  # didn't catch, not latent, the newest commit that touched its site, list
  # or tests; a shard or the survivors' job that failed with no verdict, the
  # newest that touched the runner's files. In the run's summary, an
  # `attribution-mutations` artifact and `bun run ci:status`.
  attribute-mutations:
    needs: [plan, mutations]
    if: ${{ !cancelled() && !inputs.nightly && needs.mutations.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-*-*
          path: target/attribute/mutations
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/attribute.ts mutations target/attribute/mutations ${{ needs.plan.outputs.batch_base || 'HEAD~1' }}
      - uses: actions/upload-artifact@v7
        with:
          name: attribution-mutations
          path: target/attribute/attribution-mutations.json
          retention-days: 14

  # The playground's compiler, rust-js built to WASM with rustc's front
  # end, and the snapshots and the playground it compiles, of a change to
  # what decides them (scripts/iteratorSlice.ts's `wasmPaths`, of
  # wasm/prebuilt.sh's inputs), as `plan` says: a doc's or a corpus case's
  # change ran it, 13 min, to the answer it had. The nightly runs it.
  wasm:
    needs: plan
    if: ${{ inputs.part != 'mutations' && (inputs.nightly || needs.plan.outputs.wasm == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - parallel:
          # The rustc frontend's commit is the toolchain's, asked of its
          # rustc: after it's installed, or two rustups download at once.
          - name: Install pinned toolchain and targets, and its rustc frontend
            run: |
              rustup show
              rustup target add wasm32-wasip1 wasm32-unknown-unknown
              git init -q wasm/rustc
              git -C wasm/rustc remote add origin https://github.com/rust-lang/rust.git
              git -C wasm/rustc sparse-checkout set --cone $(bun scripts/toolchain.ts sources)
              git -C wasm/rustc fetch -q --depth=1 --filter=blob:none origin "$(bun scripts/toolchain.ts commit)"
              git -C wasm/rustc checkout -q FETCH_HEAD
          # Keyed first by what decides rustc's tree, its commit, sparse
          # paths and patches, and only a target of the same tree restored:
          # build.sh makes the tree as old as `RUST_JS_RUSTC_MTIME`, so Cargo
          # takes its crates as built, and holds the tree's hash to the
          # target's.
          - uses: actions/cache@v6
            with:
              path: |
                ~/.cargo/registry
                ~/.cargo/git
                wasm/target
              key: wasm-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'scripts/toolchain.ts', 'wasm/patches/*', 'wasm/build.sh') }}-${{ hashFiles('wasm/Cargo.lock', 'wasm/Cargo.toml', 'wasm/.cargo/config.toml') }}
              restore-keys: wasm-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'scripts/toolchain.ts', 'wasm/patches/*', 'wasm/build.sh') }}-
          - run: bun install --frozen-lockfile
      # The browser, while the WASM builds: the tests after need it.
      - name: Install the browser
        id: browser
        run: bunx --bun playwright install chromium
        background: true
      - name: Build WASM from the candidate sources
        env:
          RUST_JS_RUSTC_MTIME: '200001010000'
        run: bun run wasm
      - wait: browser
      - name: Require native snapshots and browser parity
        env:
          RUST_JS_REQUIRE_WASM: '1'
        run: bun test test/snapshots.test.ts test/playground.test.ts

  # rustc's tests, all of them, against the known failures (ADR 0089), of
  # a change to what they run (`rustcPaths`), as `plan` says: its eight
  # jobs waited for machines behind the rest. The nightly runs them.
  rustc:
    needs: plan
    if: ${{ inputs.part != 'mutations' && (inputs.nightly || needs.plan.outputs.rustc == 'true') }}
    uses: ./.github/workflows/rustc-tests.yml
    # What its mutations and survivors jobs may use, though this runs
    # neither: a called workflow's every job is held to what its caller
    # grants, and a job asking more fails the run before it starts.
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      max_parallel: ${{ inputs.max_parallel }}

  # The mutations the change touches (ADR 0093): those in the functions and
  # tests it changes, and those it adds or edits, and what the last check
  # didn't catch beside them, on the fewest machines whose every shard is
  # expected to end in 10 min, by the mutations' times (`plan`'s `shards`,
  # scripts/ci.ts's `mutationShards`); of a change that touches none, as
  # `plan` says, none. Nightly runs all of them, on 16 machines.
  mutations:
    needs: plan
    if: ${{ inputs.part != 'suite' && (inputs.nightly || needs.plan.outputs.mutations == 'true') }}
    uses: ./.github/workflows/rustc-tests.yml
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      max_parallel: ${{ inputs.max_parallel }}
      mutations: true
      mutation_timings: ${{ needs.plan.outputs.mutation_timings }}
      mutation_args: ${{ !inputs.nightly && format('--changed={0} --also={1} --base={0}', needs.plan.outputs.since, needs.plan.outputs.retry) || '' }}
      mutation_shards: ${{ inputs.nightly && '16' || inputs.mutation_shards || needs.plan.outputs.shards }}
