name: Nightly

# Every test there is, of `main`, each night at 02:00 UTC+7: check.yml's
# jobs, the suite with the files only it runs (ADR 1030), the examples, the WASM compiler, rustc's tests, with
# every mutation where a branch's check runs only its own, a batch of
# generated programs, new ones each night (ADR 0092), each case of the
# corpus and each of those programs after each of tidy's stages (ADR 0659)
# and without each of preparation's rewrites (ADR 1087), each case with
# std's iterator structs alone (ADR 0908), every case of the iterator
# conformance matrix (ADR 1090), the crates of crates.io's corpus against
# docs/crate-corpus.md, and React's port against the JS it committed. Of a
# public repository, GitHub's machines cost nothing. A red night opens an
# issue, `Nightly red: <date>`, which the issue watch gives an owner;
# `bun run ci:status` shows the latest run.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # check.yml's plan reads its runs.
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      test_shards: '2'
      nightly: true

  # Each night's programs are new: 600 from the day's number times 600.
  seeds:
    runs-on: ubuntu-latest
    outputs:
      start: ${{ steps.start.outputs.start }}
    steps:
      - id: start
        run: echo "start=$(( $(date +%s) / 86400 * 600 ))" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: seeds
    uses: ./.github/workflows/rustc-tests.yml
    with:
      fuzz_seeds: '600'
      fuzz_start: ${{ needs.seeds.outputs.start }}

  # Tidy's stages and preparation's rewrites on the whole corpus (ADRs
  # 0659, 1087): each case's JS as tidy leaves it after each stage, and as
  # preparation leaves it without each rewrite that changed it, runs as
  # native Rust does, a sixth of the cases on each of six machines; the
  # nightly's suite runs a few of them.
  stages:
    name: tidy stages (${{ matrix.part }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Each stage's JS runs under Node, whose TypeScript runner needs 22.18 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      # Each case's native side is built with the pinned toolchain.
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run part ${{ matrix.part }} of 6
        env:
          TIDY_STAGES: corpus
          RUST_JS_CASES: ${{ matrix.part }}/6
          RUST_JS_COMPILER: target/release/rust-js
        run: bun test --timeout=300000 test/tidy-stages.test.ts

  # The night's generated programs through the same (ADR 1087): each of
  # the day's 600, whose JS runs as native Rust's, after each of tidy's
  # stages and without each of preparation's rewrites that changed it, a
  # hundred on each of six machines; one that differs is reduced, in
  # `target/fuzz/seed-<n>.stages.rs`.
  programs:
    name: program stages (${{ matrix.part }}/6)
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run part ${{ matrix.part }} of 6
        env:
          TIDY_STAGES: programs
          START: ${{ needs.seeds.outputs.start }}
          PART: ${{ matrix.part }}
          RUST_JS_COMPILER: target/release/rust-js
        run: FUZZ_START=$(( START + (PART - 1) * 100 )) FUZZ_SEEDS=100 bun test --timeout=900000 test/tidy-stages.test.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: program-stages-${{ matrix.part }}
          path: target/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  # One meaning per iterator (ADR 0908): each case built with std's
  # iterator structs alone, none rewritten in place, runs as native Rust
  # does, but the cases `differs` lists; the nightly's suite runs a few of them.
  forms:
    name: iterator forms (${{ matrix.part }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run part ${{ matrix.part }} of 2
        env:
          ITERATOR_FORMS: corpus
          RUST_JS_CASES: ${{ matrix.part }}/2
          RUST_JS_COMPILER: target/release/rust-js
        run: bun test --timeout=300000 test/iterator-forms.test.ts

  # The `&mut` matrix (ADR 1086): each pointee of a `&mut`, held each way,
  # through each operation, runs as native Rust does; each push runs a sample.
  mut-refs:
    name: mut-ref matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run every program
        env:
          MUT_REF_MATRIX: all
          RUST_JS_COMPILER: target/release/rust-js
        run: bun test --timeout=300000 test/mut-ref-matrix.test.ts

  # The iterator conformance matrix (ADR 1090): every case, each source,
  # chain, consumer and panic site, in both builds against native Rust, but
  # those test/iterator-matrix-known.txt lists; a push that changes the
  # iterators' runtime or lowering runs a sample (iterator-matrix.yml).
  matrix:
    name: iterator matrix (${{ matrix.machine }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        machine: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Four parts of the 24 on each machine, one a core.
      - name: Run parts of machine ${{ matrix.machine }} of 6
        env:
          ITERATOR_MATRIX: all
          RUST_JS_COMPILER: target/release/rust-js
          MACHINE: ${{ matrix.machine }}
        run: |
          pids=()
          for core in 1 2 3 4; do
            part=$(( (MACHINE - 1) * 4 + core ))
            RUST_JS_CASES=$part/24 bun test --timeout=900000 test/iterator-matrix.test.ts > "matrix-$part.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          cat matrix-*.log
          exit $failed
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iterator-matrix-${{ matrix.machine }}
          path: target/iterator-matrix
          if-no-files-found: ignore
          retention-days: 14

  # The crates from crates.io the guide says run (docs/crate-corpus.md):
  # each compiled with every crate it uses, its probe run beside native
  # Rust, a crate doing worse than its row says failing the job, as chrono
  # and rust_decimal went from runs to refused unseen (#467, #468).
  crates:
    name: crate corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      # Each crate's graph at its lock (ADR 1067, amended). Cargo's jobs at
      # their default again: what shut the runner down, regex-syntax's
      # `==` inlined without end, is fixed, and rust-js's largest process
      # of the corpus is 427 MB (#511).
      - name: Compile and run each crate's probe
        env:
          RUST_JS_COMPILER: target/release/rust-js
        run: bun scripts/crate-corpus.ts --check

  # React's port (scripts/react-in-rust.ts): react-in-rust at the commit
  # `ports/react-in-rust.pin` names, each of its crates compiled to JS by
  # this compiler, against the JS that commit committed. A compile error or
  # a file that differs fails it, the summary listing each file and its
  # first lines of change, the whole diff an artifact: a change to the
  # port's JS is seen the night it's made, not at its porter's next
  # regeneration (rd540, rd617, rd623). One that's intended is accepted by
  # moving the pin to the port's commit that regenerated it.
  port:
    name: react-in-rust port
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # All of `main`'s history, so the report lists the commits since the
      # rust-js the pin's JS was made on.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # rust-js's build CLI, as the port's `yarn rust` runs it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Compile the port's crates and compare their JS
        env:
          RUST_JS_COMPILER: target/release/rust-js
        run: bun scripts/react-in-rust.ts regen
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: react-in-rust-diff
          path: target/react-in-rust.diff
          if-no-files-found: ignore
          retention-days: 14

  # A red night of `main` is an issue, "Nightly red: <date>", opened or, run
  # again that day, commented on, naming each failed job with its link: the
  # issue watch gives it an owner that day, and no one polls for it.
  issue:
    needs: [check, seeds, fuzz, stages, programs, forms, mut-refs, matrix, crates, port]
    if: always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the night's issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          day=$(TZ=Asia/Bangkok date +%F)
          title="Nightly red: $day"
          failed=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"')
          body=$(printf 'The nightly of `main` at %s failed: %s\n\n%s\n\nRead each failed job'"'"'s log (`gh run view %s --log-failed`); a regression is fixed, or filed as an issue of its own, and this is closed.\n' \
            "${GITHUB_SHA:0:9}" "$RUN" "$failed" "${{ github.run_id }}")
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
