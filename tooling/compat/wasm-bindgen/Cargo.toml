# rust-js's own wasm-bindgen, which an app's dependencies use in place of
# crates.io's: the patch rust-js writes names it where Cargo's graph has
# wasm-bindgen (ADR 1112). Each item is a mapping onto the js and webapi crates'
# bindings, grown from what crates use. Its version is the newest of
# crates.io's of its minor, so each `^` requirement takes it.
[package]
name = "wasm-bindgen"
version = "0.2.130"
edition = "2024"
description = "rust-js's wasm-bindgen's API, as crates use it: JS values and the bindings they declare"
license = "MIT"
repository = "https://github.com/rust-js-lang/rust-js"
publish = false

[lib]
name = "wasm_bindgen"
path = "src/lib.rs"

[dependencies]
wasm-bindgen-macro = "=0.2.130"
js = { package = "rust-js-builtins", version = "~0.0.2" }

# crates.io's features, by name, so a dependent's ask resolves: what
# one adds is grown as the rest of the API is, a call of what's not
# there rustc's error.
[features]
default = ["std"]
enable-interning = ["std"]
gg-alloc = []
msrv = []
rustversion = []
serde-serialize = ["std"]
spans = []
std = []
strict-macro = ["wasm-bindgen-macro/strict-macro"]
xxx_debug_only_print_generated_code = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }

# A binding crate: rustc checks it and rust-js reads its metadata (ADRs
# 0024, 0414).
[package.metadata.rust-js]
bindings = true
