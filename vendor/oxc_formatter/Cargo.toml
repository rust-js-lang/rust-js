[package]
name = "oxc_formatter"
version = "0.68.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_ast = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_jsdoc = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_parser = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0", optional = true }
oxc_span = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_str = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
cow-utils = "0.1.3"
fast-glob = "1.1.1"
markdown = "1.0.0"
natord = "1.0.9"
nodejs-built-in-modules = "1.0.0"
itoa = "1.0.18"
phf = { version = "0.14.0", features = ["macros"] }
rustc-hash = "2"
smallvec = { version = "1.15.2", features = ["union", "serde"] }
unicode-width = "0.2"

[features]
default = []
detect_code_removal = ["dep:oxc_semantic"]

[lib]
doctest = false
