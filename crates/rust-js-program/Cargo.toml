# The compiler's owned output (ADR 1181): the program rust-js writes, its
# names, links and runtime, held in data of its own, with no rustc in it.
# The front end builds it; nothing here knows the front end or the printer.
[package]
name = "rust-js-program"
version = "0.0.4"
edition = "2024"
publish = false

[dependencies]
indexmap.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
# The class names a CSS Module exports, which a binding of one is checked
# against (#1512): pinned, its default features off, `css_modules.rs` its
# one reader.
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }

# A crate's settings, in its Cargo.toml (ADR 0117): read natively only. The
# playground has none.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
toml.workspace = true

[features]
# What a test makes and a compile never does, a `Name` or a `Pattern` of a
# word alone (#2034): the crate's own tests', and its dependents' through
# their dev-dependency on it, never a compile's.
testing = []
