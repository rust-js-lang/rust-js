[package]
name = "rust-js"
version = "0.0.4"
edition = "2024"
# These are compiler input fixtures, not native Cargo example binaries.
autoexamples = false
description = "Compile Rust to readable JavaScript, in the spirit of ReScript"

[package.metadata.rust-analyzer]
rustc_private = true

# oxc prints the JS, formats it as oxfmt does, and builds source maps. It is
# pre-1.0 and changes often: pin one release, and keep every use of its API in
# src/to_oxc.rs and src/format.rs. Its formatter isn't published to crates.io,
# so every oxc crate comes from that release's tag, as one copy.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_ast = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_ast_visit = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_codegen = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_parser = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_regular_expression = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_sourcemap = "=8.1.2"
oxc_span = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.151.0" }

# A crate's settings, in its Cargo.toml (ADR 0117): read natively only. The
# playground has none.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
toml = "1"
# Clippy's lints, which `rust-js clippy` runs with rust-js's JSX and
# liveness (ADR 0888): natively only, as the playground lints nothing. They
# use rustc's internal crates, so they're the clippy the pinned release has:
# rust-clippy's commit whose tree is the release's `src/tools/clippy` when
# it branched (rust-lang/rust@8dac1c68), not its `rust-1.99.0` tag, which
# is older. A toolchain bump moves the commit with it (DEVELOPMENT.md).
clippy_config = { git = "https://github.com/rust-lang/rust-clippy", rev = "2bc35de067e2a538568a675c8cf26e60884cc7e1" }
clippy_lints = { git = "https://github.com/rust-lang/rust-clippy", rev = "2bc35de067e2a538568a675c8cf26e60884cc7e1" }
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "2bc35de067e2a538568a675c8cf26e60884cc7e1" }
declare_clippy_lint = { git = "https://github.com/rust-lang/rust-clippy", rev = "2bc35de067e2a538568a675c8cf26e60884cc7e1" }

# No debug info in a dev build. On macOS it stays in each build's object
# files, which incremental compilation names anew each time and nothing
# removes: target/debug/deps held 381 000 of them, 61 GB, by 2026-10-07,
# and the mutations' builds 55 GB more. Packed into a .dSYM instead, each
# link takes some 20 s more; without it, a change builds in about 2 s.
[profile.dev]
debug = false
