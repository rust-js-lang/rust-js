name: Nightly

# Every test there is, of `main`, each night at 02:00 UTC+7: check.yml's
# jobs, the suite, the examples, the WASM compiler, rustc's tests, with
# every mutation where a branch's check runs only its own, a batch of
# generated programs, new ones each night (ADR 0092), and each case of the
# corpus after each of tidy's stages (ADR 0659) and with std's iterator
# structs alone (ADR 0908). Of a public
# repository, GitHub's machines cost nothing. A failure is mailed to whoever
# last changed this schedule; `bun run ci:status` shows the latest run.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # check.yml's plan reads its runs.
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      test_shards: '2'
      nightly: true

  # Each night's programs are new: 600 from the day's number times 600.
  seeds:
    runs-on: ubuntu-latest
    outputs:
      start: ${{ steps.start.outputs.start }}
    steps:
      - id: start
        run: echo "start=$(( $(date +%s) / 86400 * 600 ))" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: seeds
    uses: ./.github/workflows/rustc-tests.yml
    with:
      fuzz_seeds: '600'
      fuzz_start: ${{ needs.seeds.outputs.start }}

  # Tidy's stages on the whole corpus (ADR 0659): each case's JS as tidy
  # leaves it after each stage runs as native Rust does, a sixth of the
  # cases on each of six machines; the suite runs a few of them.
  stages:
    name: tidy stages (${{ matrix.part }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Each stage's JS runs under Node, whose TypeScript runner needs 22.18 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      # Each case's native side is built with the pinned toolchain.
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run part ${{ matrix.part }} of 6
        env:
          TIDY_STAGES: corpus
          RUST_JS_CASES: ${{ matrix.part }}/6
          RUST_JS_COMPILER: target/release/rust-js
        run: bun test --timeout=300000 test/tidy-stages.test.ts

  # One meaning per iterator (ADR 0908): each case built with std's
  # iterator structs alone, none rewritten in place, runs as native Rust
  # does, but the cases `differs` lists; the suite runs a few of them.
  forms:
    name: iterator forms (${{ matrix.part }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - uses: ./.github/actions/build-rust-js
      - name: Run part ${{ matrix.part }} of 2
        env:
          ITERATOR_FORMS: corpus
          RUST_JS_CASES: ${{ matrix.part }}/2
          RUST_JS_COMPILER: target/release/rust-js
        run: bun test --timeout=300000 test/iterator-forms.test.ts
