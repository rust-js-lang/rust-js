# rust-js's own js-sys, which an app's dependencies use in place of
# crates.io's: the patch rust-js writes names it where Cargo's graph has
# js-sys (ADR 1112). Each item is a mapping onto the js and webapi crates'
# bindings, grown from what crates use. Its version is the newest of
# crates.io's of its minor, so each `^` requirement takes it.
[package]
name = "js-sys"
version = "0.3.107"
edition = "2024"
description = "rust-js's js-sys's API, as crates use it: JS's builtins, `Date`, `Uint8Array`, `global()`"
license = "MIT"
repository = "https://github.com/rust-js-lang/rust-js"
publish = false

[lib]
name = "js_sys"
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "=0.2.130"
js = { package = "rust-js-builtins", version = "~0.0.2" }

# crates.io's features, by name, so a dependent's ask resolves: what
# one adds is grown as the rest of the API is, a call of what's not
# there rustc's error.
[features]
default = ["std", "unsafe-eval"]
futures-core-03-stream = []
std = ["wasm-bindgen/std"]
temporal = []
unsafe-eval = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }

