# Build the guide, docs/guide, as a static site and deploy it to GitHub Pages
# (ADR 0600). Run it by hand from the Actions tab, or with `bun run deploy`.
# `bun run guide-site` builds the same site into target/guide-site.
name: Deploy guide

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # A link in the guide that leads nowhere fails the build.
      - name: Build the guide's site
        run: bun guide-site/build.ts target/guide-site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/guide-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
