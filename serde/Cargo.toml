# The crates of crates.io rust-js reads as rustc builds them, serde,
# serde_derive and serde_json (ADR 0077), hashbrown (ADR 0423) and indexmap
# (ADR 0424), built
# with rust-js's pinned toolchain, for a crate rust-js compiles to depend
# on. `serde/build.sh` builds them and prints the `--extern` flags that
# find them.
[package]
name = "rust-js-serde"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hashbrown = "=0.17.1"
indexmap = "=2.14.2"

# Standalone: not part of the rust-js package one directory up.
[workspace]
