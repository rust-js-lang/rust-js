# rust-js's own wasm-bindgen-test-macro, `#[wasm_bindgen_test]`, which an
# app's dependencies use in place of crates.io's (ADR 1112): a `#[test]`.
[package]
name = "wasm-bindgen-test-macro"
version = "0.3.80"
edition = "2024"
description = "rust-js's `#[wasm_bindgen_test]`: a `#[test]`"
license = "MIT"
repository = "https://github.com/rust-js-lang/rust-js"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# A binding crate: rustc builds it, for the host, as any proc macro.
[package.metadata.rust-js]
bindings = true
