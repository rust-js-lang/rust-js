name: Check

# Every check but the inner loop's, of each push to `main`, so a change is
# made here and proved there while the next one is made (DEVELOPMENT.md):
# the repository is public, and its machines cost nothing. Of another
# branch, started by hand, `bun run ci:check`; `main`'s push starts its own. Its jobs run at once; a red
# one is fixed at once, on `main`. A job whose snapshots or rustc's lists differ uploads what
# blessing them writes, a `bless-*` artifact, which `bun run ci:bless`
# applies to be read.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_shards:
        description: 'Machines the suite is split across: more is sooner, and more minutes, as each sets itself up.'
        type: choice
        options: ['1', '2', '4']
        default: '2'
      since:
        description: 'The commit whose changes since are the mutations run: of main, its last checked one.'
        type: string
        default: 'origin/main'
      mutation_shards:
        description: 'Machines the mutations are split across, as many as keeps each near forty: ci:check counts them.'
        type: choice
        options: ['1', '2', '4', '8', '16']
        default: '1'
  # By nightly.yml, of `main`: every mutation, where a branch's check runs
  # only its own.
  workflow_call:
    inputs:
      test_shards:
        type: string
        default: '2'
      nightly:
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time of each branch, and no branch's touches another's. A
# run waits for the one running, then runs, and never cancels it, a push's
# and one started by hand alike: of several waiting, only the newest runs,
# and the next finished run's mutations are of all their changes (the
# `plan` job). (When a run started by hand cancelled the one running, with
# three agents pushing to `main`, each starting one after it pushed, no
# check of `main` finished for hours.) rustc-tests.yml's runs are a group
# of their own, and so is nightly.yml's call, so neither waits for nor
# cancels this.
concurrency:
  group: ${{ github.workflow == 'Check' && format('ci-{0}', github.ref) || format('ci-{0}', github.workflow) }}
  cancel-in-progress: false

jobs:
  # Which mutations, those of what changed since `main`'s last finished
  # check, a cancelled one's changes too, and on how many machines.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      since: ${{ steps.plan.outputs.since }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci.ts plan >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run fmt:check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  # The suite, on one machine, or split across `test_shards`, by how long
  # each file took in the last run that kept its timings (`bun test
  # --shard`): each shard uploads what it measured, `timings-<shard>`, and
  # the next run's shards read them all, so the shards finish together.
  test:
    name: test (${{ matrix.shard }}/${{ inputs.test_shards || '2' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.test_shards == '4' && '[1, 2, 3, 4]' || (inputs.test_shards || '2') == '2' && '[1, 2]' || '[1]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The corpus runs its cases under Node too, whose TypeScript runner
      # needs Node 22.18 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Each of what the suite needs at once (parallel steps): the
      # toolchain, the last build, and the packages with their browser.
      - parallel:
          - name: Install pinned Rust toolchain
            run: rustup show
          - uses: actions/cache@v6
            with:
              path: |
                ~/.cargo/registry
                ~/.cargo/git
                target/debug
              key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
              restore-keys: test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
          - name: Install packages and the browser
            run: |
              bun install --frozen-lockfile
              bunx --bun playwright install --with-deps chromium
      - name: Read the last run's timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci.ts timings
      - id: test
        run: bun run test --shard=${{ matrix.shard }}/${{ inputs.test_shards || '2' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.shard }}
          path: target/test-timings.json
          if-no-files-found: ignore
          retention-days: 7
      # What differs, blessed, as a patch to read and apply: never pushed.
      - name: Bless what differs
        if: failure() && steps.test.outcome == 'failure'
        run: |
          BLESS=1 RUST_JS_COMPILER="$PWD/target/debug/rust-js" bun scripts/test.ts --shard=${{ matrix.shard }}/${{ inputs.test_shards || '2' }} || true
          git add -A
          git diff --cached --binary > bless.patch
      - if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: bless-test-${{ matrix.shard }}
          path: bless.patch
          if-no-files-found: ignore
          retention-days: 7

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - parallel:
          - name: Install pinned Rust toolchain
            run: rustup show
          - uses: actions/cache@v6
            with:
              path: |
                ~/.cargo/registry
                ~/.cargo/git
                target/debug
              key: examples-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
              restore-keys: examples-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
          - run: bun install --frozen-lockfile
      # The compiler the example's Vite plugin finds, this checkout's.
      - run: cargo build --locked
      - run: bun run --cwd examples/vite-react build

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - parallel:
          # The rustc frontend's commit is the toolchain's, asked of its
          # rustc: after it's installed, or two rustups download at once.
          - name: Install pinned toolchain and targets, and its rustc frontend
            run: |
              rustup show
              rustup target add wasm32-wasip1 wasm32-unknown-unknown
              git init -q wasm/rustc
              git -C wasm/rustc remote add origin https://github.com/rust-lang/rust.git
              git -C wasm/rustc sparse-checkout set --cone compiler library/proc_macro
              git -C wasm/rustc fetch -q --depth=1 --filter=blob:none origin "$(bun scripts/toolchain.ts commit)"
              git -C wasm/rustc checkout -q FETCH_HEAD
          - uses: actions/cache@v6
            with:
              path: |
                ~/.cargo/registry
                ~/.cargo/git
                wasm/target
              key: wasm-check-${{ runner.os }}-${{ hashFiles('wasm/Cargo.lock', 'wasm/patches/*', 'wasm/.cargo/config.toml', 'rust-toolchain.toml') }}
              restore-keys: wasm-check-${{ runner.os }}-
          - run: bun install --frozen-lockfile
      # The browser, while the WASM builds: the tests after need it.
      - name: Install the browser
        id: browser
        run: bunx --bun playwright install --with-deps chromium
        background: true
      - name: Build WASM from the candidate sources
        run: bun run wasm
      - wait: browser
      - name: Require native snapshots and browser parity
        env:
          RUST_JS_REQUIRE_WASM: '1'
        run: bun test test/snapshots.test.ts test/playground.test.ts

  # rustc's tests, all of them, against the known failures (ADR 0089).
  rustc:
    uses: ./.github/workflows/rustc-tests.yml

  # The mutations the change touches (ADR 0093): those in the functions and
  # tests it changes, and those it adds or edits, on as many machines as
  # ci:check counts they need. Nightly runs all of them, on 16 machines.
  mutations:
    needs: plan
    uses: ./.github/workflows/rustc-tests.yml
    with:
      mutations: true
      mutation_args: ${{ !inputs.nightly && format('--changed={0}', inputs.since || needs.plan.outputs.since) || '' }}
      mutation_shards: ${{ inputs.nightly && '16' || inputs.mutation_shards || needs.plan.outputs.shards }}
