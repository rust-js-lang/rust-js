name: Issue labels

# Every issue carries the labels docs/bug-kinds.md asks for: a priority (or
# `tracking`), a kind and an area. An issue opened, edited or relabelled
# without them is labelled `needs-labels`, with one comment saying what it
# misses; the label comes off when they're there. Daily, every open issue is
# checked the same way, so one filed while this was off is caught too.
#
# And Campaign 6's stopgap refusals (ADR 1201): an issue `refusal::Crossing`
# maps a cell to, closed while the cell's refusals remain on main, fails
# here and is told so, as an issue closes and daily
# (scripts/stopgap-refusals.ts).
on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-labels-${{ github.event.issue.number || 'all' }}

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/issue-labels.ts
            scripts/stopgap-refusals.ts
            crates/rust-js-lower/src/refusal.rs
            package.json
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "${{ github.event.issue.number }}" ]; then
            bun scripts/issue-labels.ts --mark --issue ${{ github.event.issue.number }}
          else
            bun scripts/issue-labels.ts --mark
          fi
      - name: Stopgap refusals' issues
        if: github.event.action == 'closed' || github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/stopgap-refusals.ts --mark
