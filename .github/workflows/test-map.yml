name: test map

# The test map (scripts/testMap.ts, ADR 1101, amended): which of the
# compiler's functions each test of the push suite and each corpus case
# runs, recorded in parts. The selector reads it, each push's check here
# (check.yml's `plan`) and `bun run push` (scripts/select.ts), and each
# mutation shard's snapshot judge (ADR 0093, amended).
#
# Of each push to `main` that changes what a test runs (`paths`), HEAD's
# map (a failing test's units are `null`, run on every change), beside the
# push's check: started after the check ended, 22–28 min, and taking 10–17
# min, the map trailed some 40 min of pushes, 10 to 16 commits behind each
# push's line; the check's suite, on one machine of a small selection, now
# leaves it room. One run at a time, the running one never cancelled, and
# of those waiting only the newest kept (GitHub replaces a pending run of
# the group with the next): cancelling the running one cancelled every one,
# and no map was recorded for 9 commits (ADR 1101, amended). Kept in the Actions cache
# by its commit, `test-map-<os>-<toolchain>-<sha>`, one map each, the
# newest 8 (about 6 MB each, cache-prune.yml's, as every cache family's); `bun run push` downloads the newest of an
# ancestor of its HEAD (`fetchMap`). Called by rustc-tests.yml's mutations,
# the map of HEAD or an ancestor kept, or HEAD's recorded where none is.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
  workflow_call:
    inputs:
      of:
        description: "'head': HEAD's map, recorded where none is kept; 'any': HEAD's or an ancestor's kept."
        type: string
        default: 'any'
      full:
        description: "The nightly's: HEAD's map recorded whole, never carried, then checked against what a carry makes of it (`testMap.ts drift`), a drift making each recording full until a nightly's check passes."
        type: boolean
        default: false
      max_parallel:
        description: "How many of the recording's parts at once; '' all (scripts/runners.ts)."
        type: string
        default: ''
    outputs:
      key:
        description: "The Actions cache's key of the map store it served or recorded, which each mutation shard restores: the same store, from the cache, never an artifact each shard downloads."
        value: ${{ jobs.test-map.outputs.key }}

permissions:
  contents: read
  actions: read

# Called or pushed, by `inputs.of`, which only a call gives: a called
# workflow's event is its caller's, `push` of each check of
# main, so a call was taken for the push's own run: it uploaded
# `test-map-of-<sha>`, and every mutation shard's download of `test-map`
# failed (check 43889550882, 2026-11-16); it recorded HEAD's map where an
# ancestor's served; and it joined the push's group, where a newer push's
# run could replace it.
concurrency:
  group: ${{ inputs.of && format('test-map-{0}-{1}', github.run_id, github.workflow) || 'test-map' }}
  cancel-in-progress: false

env:
  # The commit the map is of: the push's, or the caller's.
  SHA: ${{ github.sha }}

jobs:
  # The map kept, or the counting build and the plan of its recording, in
  # `SHARDS` parts: each part's tests about 9 min.
  test-map:
    name: test map
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      record: ${{ steps.map.outputs.record }}
      key: ${{ steps.map.outputs.key }}
      shards: ${{ steps.map.outputs.shards }}
      parts: ${{ steps.map.outputs.parts }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/rustc-tests-setup
        with:
          build: 'false'
      - uses: actions/cache/restore@v6
        id: kept
        with:
          path: .cache/test-maps
          key: test-map-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.SHA }}
          restore-keys: test-map-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: The map kept, or the counting build and the plan of its recording
        id: map
        env:
          OF: ${{ inputs.of || 'head' }}
          FULL: ${{ inputs.full && 'true' || 'false' }}
          SHARDS: '8'
          # The store served, as restored; or the one the merge saves.
          KEPT: ${{ steps.kept.outputs.cache-matched-key }}
          RECORDED: test-map-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.SHA }}
        run: |
          if [ "$OF" = "head" ]; then of=--head; else of=; fi
          if [ "$FULL" != "true" ] && bun scripts/testMap.ts kept $of; then
            echo "record=false" >> "$GITHUB_OUTPUT"
            echo "key=$KEPT" >> "$GITHUB_OUTPUT"
          else
            echo "key=$RECORDED" >> "$GITHUB_OUTPUT"
            # Incremental where an earlier map serves (`planCarry`); whole of
            # the nightly's, `full`.
            if [ "$FULL" = "true" ]; then full=--full; else full=; fi
            bun scripts/testMap.ts build --shards="$SHARDS" $full
            # A tar, which keeps the binary's mode, as an artifact doesn't.
            tar -cf test-map-build.tar target/test-map/build/debug/rust-js
            echo "record=true" >> "$GITHUB_OUTPUT"
          fi
      # Of a push, not a call: a call's shards restore the store from the
      # cache by `key`, 7.9 MB each a download of an artifact where GitHub's
      # storage turns some away ("Egress is over the account limit").
      - if: steps.map.outputs.record == 'false' && !inputs.of
        uses: actions/upload-artifact@v7
        with:
          # Of main's check, by its commit, which `bun run push` fetches (`fetchMap`).
          name: test-map-of-${{ env.SHA }}
          path: .cache/test-maps
          include-hidden-files: true
          retention-days: 3
      - if: steps.map.outputs.record == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-map-build
          path: test-map-build.tar
          retention-days: 1
      - if: steps.map.outputs.record == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-map-plan
          # And the map it carries from, which the merge reads (`carriedFrom`).
          path: |
            target/test-map/plan.json
            target/test-map/from.json
          if-no-files-found: ignore
          retention-days: 1

  # A part of the map's recording, its plan's share of the tests, each run
  # with the counting build; the browsers' too, as the push suite runs them.
  test-map-part:
    needs: test-map
    if: ${{ needs.test-map.outputs.record == 'true' }}
    name: test map (${{ matrix.part }}/${{ needs.test-map.outputs.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      max-parallel: ${{ fromJSON(inputs.max_parallel || '20') }}
      matrix:
        part: ${{ fromJSON(needs.test-map.outputs.parts) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/rustc-tests-setup
        with:
          build: 'false'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx --bun playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: test-map-build
      - uses: actions/download-artifact@v8
        with:
          name: test-map-plan
          path: target/test-map
      - name: The part's tests
        run: |
          tar -xf test-map-build.tar
          bun scripts/testMap.ts units --shard=${{ matrix.part }}/${{ needs.test-map.outputs.shards }}
          tar -cf test-map-part-${{ matrix.part }}.tar target/test-map/recordings/${{ matrix.part }}
      - uses: actions/upload-artifact@v7
        with:
          name: test-map-part-${{ matrix.part }}
          path: test-map-part-${{ matrix.part }}.tar
          retention-days: 1

  # The one map of every part's recording, alone in the cache's entry of
  # its commit, and given to the caller's jobs. The cache's maps past the
  # newest 8 are removed after (cache-prune.yml, which may write).
  test-map-merge:
    needs: [test-map, test-map-part]
    if: ${{ needs.test-map.outputs.record == 'true' }}
    name: test map merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: test-map-plan
          path: target/test-map
      - uses: actions/download-artifact@v8
        with:
          pattern: test-map-part-*
          merge-multiple: true
      - name: The map of every part
        run: |
          for part in test-map-part-*.tar; do tar -xf "$part"; done
          bun scripts/testMap.ts merge
      # The nightly's: the full map against what a carry makes of it; a
      # drift fails the run and leaves `drift-failed` in the store the cache
      # keeps, each recording full until a nightly's check passes.
      - if: inputs.full
        name: The drift check
        run: bun scripts/testMap.ts drift || { echo "drift=true" >> "$GITHUB_ENV"; }
      - if: always() && inputs.full && env.drift == 'true'
        run: |
          echo "the test map's drift check failed: recordings are full until a nightly's passes" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/cache/save@v6
        with:
          path: .cache/test-maps
          key: test-map-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.SHA }}
      - if: ${{ !inputs.of }}
        uses: actions/upload-artifact@v7
        with:
          # Of main's check, by its commit, which `bun run push` fetches (`fetchMap`).
          name: test-map-of-${{ env.SHA }}
          path: .cache/test-maps
          include-hidden-files: true
          retention-days: 3
